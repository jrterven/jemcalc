<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' file: data:; connect-src 'none'">
<link rel="stylesheet" href="../mathlive/mathlive-fonts.css"><link rel="stylesheet" href="../mathlive/mathlive-static.css"><script src="../mathlive/mathlive.min.js"></script><script>MathfieldElement.fontsDirectory="../mathlive/fonts";MathfieldElement.soundsDirectory=null;</script>
<style>
:root { color-scheme:light; --bg:#fff3f1;--fg:#2d1b20;--accent:#b9263d;--on-accent:#ffffff;--key:#ffffff;--key-hover:#fff0f2;--key-pressed:#ffdce2;--line:#edd7d8; }
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow-y:auto}#field-wrap{padding:8px 6px;min-height:96px;display:flex;align-items:center;flex:1;overflow:auto}math-field{width:100%;min-width:0;border:0;outline:none;background:transparent;color:var(--fg);font-size:30px;padding:6px;--caret-color:var(--accent);--selection-background-color:#c42d4340;--placeholder-color:var(--accent);--contains-highlight-background-color:#c42d4320;--smart-fence-color:var(--accent)}math-field::part(virtual-keyboard-toggle),math-field::part(menu-toggle){display:none}
#keyboard{width:100%;height:280px;flex-shrink:0;position:relative;--keyboard-background:var(--bg);--keyboard-toolbar-background:var(--bg);--keycap-background:var(--key);--keycap-text:var(--fg);--keycap-background-hover:var(--key-hover);--keycap-text-hover:var(--fg);--keycap-background-active:var(--key-pressed);--keycap-text-active:var(--fg);--keycap-background-pressed:var(--key-pressed);--keycap-text-pressed:var(--fg);--keycap-secondary-background:var(--key);--keycap-secondary-background-hover:var(--key-hover);--keycap-secondary-text:var(--fg);--keycap-primary-background:var(--accent);--keycap-primary-background-hover:var(--accent);--keycap-primary-text:var(--on-accent);--keycap-height:46px;--keycap-width:calc((100cqw - 24px)/4);--keyboard-toolbar-font-size:14px;--keyboard-toolbar-text-active:var(--accent);--keycap-gap:4px;--keycap-font-size:22px;--keyboard-padding-bottom:4px;--keyboard-padding-top:4px;--keycap-border:1px solid var(--line);--keycap-border-radius:12px;--keycap-shadow:none;--keyboard-toolbar-text:var(--fg)}
#keyboard .MLK__toolbar>.left{column-gap:8px}
#jem-scientific .MLK__rows{--keycap-width:calc((100cqw - 24px)/5);--_keycap-font-size:20px;--_keycap-small-font-size:13px}
#jem-abc .MLK__rows{--keycap-width:min(68px,calc((100cqw - 16px)/10));--_keycap-gap:2px;--_keycap-font-size:18px}
#keyboard.hidden{display:none}body.compact #field-wrap{min-height:60px;padding:4px 8px}body.compact math-field{font-size:27px}
@media(max-height:420px){#field-wrap{min-height:64px;padding:0 6px}}
/* Only the equation viewport yields space to a hint. The keyboard stays pinned
   to the editor's bottom, including while the suggestion appears/disappears. */
#display{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
#result{flex-shrink:0;margin:4px 4px 6px;padding:8px 6px 8px 14px;border-radius:16px;background:var(--result,#ffe8e9);display:flex;align-items:center;gap:4px}
#result[hidden],#result [hidden]{display:none}
#result-content{flex:1;min-width:0}
#result-heading{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
#result-expression{overflow:auto;max-height:60px}
#result-math{font-size:24px;padding:0;display:inline-block;width:max-content;white-space:nowrap}
#result-plain{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
#result-approximation{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:3px}
#result button{flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;color:var(--fg);background:transparent;cursor:pointer}
#result button:hover{background:var(--key-hover)}#result button:active{background:var(--key-pressed)}
#result button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#result svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
#completion{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:2px 8px 4px;max-width:100%}
#completion[hidden]{display:none}
#completion-message{flex:1;min-width:0;font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#completion-actions{display:flex;gap:8px;min-width:0;flex:0 1 auto;overflow-x:auto;scrollbar-width:none}
#completion.multiple{flex-direction:column;align-items:stretch;gap:2px}
#completion-actions button{flex-shrink:0;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--accent);font:500 13px -apple-system,system-ui,sans-serif;white-space:nowrap;cursor:pointer}
#completion-actions button:hover{background:var(--key-hover)}
#completion-actions button:active{background:var(--key-pressed)}
#completion-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
</style></head><body><div id="display"><div id="field-wrap"><math-field id="mf" aria-label="Equation" inputmode="none" math-virtual-keyboard-policy="manual"></math-field></div><div id="result" role="region" hidden><div id="result-content" aria-live="polite"><div id="result-heading"><span id="result-status"></span><span id="result-verified" hidden>✓</span></div><div id="result-expression"><div id="result-math" role="math"></div><div id="result-plain" hidden></div></div><div id="result-approximation" hidden></div></div><button id="result-details" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v7m0-11v2"/></svg></button><button id="result-copy" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="12" height="15" rx="2"/><path d="M5 7H4v14h12v-1"/></svg></button></div></div><div id="completion" hidden><span id="completion-message"></span><div id="completion-actions"></div></div><div id="keyboard"></div>
<script>
MathfieldElement.fontsDirectory='../mathlive/fonts';MathfieldElement.soundsDirectory=null;
const mf=document.getElementById('mf');const keyboard=document.getElementById('keyboard');let suppress=false;let ready=false;let lastLanguage=null;let keyboardWanted=false;let lastFocusRequest=0;
function send(data){if(window.JemBridge)JemBridge.postMessage(JSON.stringify(data));else if(parent!==window)parent.postMessage(JSON.stringify({channel:'jem-editor',...data}),location.origin);}
let lastCompletion;
function configureCompletion(proposal){
 const signature=JSON.stringify(proposal);
 if(signature===lastCompletion)return;
 lastCompletion=signature;
 const bar=document.getElementById('completion'),actions=document.getElementById('completion-actions');
 actions.replaceChildren();bar.hidden=!proposal?.actions?.length;
 if(bar.hidden)return;
 const message=document.getElementById('completion-message');
 message.textContent=proposal.message;message.title=proposal.message;
 bar.classList.toggle('multiple',proposal.actions.length>1);
 for(const action of proposal.actions){
  const button=document.createElement('button');button.type='button';button.textContent=action.label;
  button.title=proposal.message;button.setAttribute('aria-describedby','completion-message');
  button.addEventListener('mousedown',event=>event.preventDefault());
  button.addEventListener('click',()=>{
   mf.focus({preventScroll:true});
   send({type:'completion',source:proposal.source,latex:action.latex,focusSlot:action.focusSlot});
  });
  actions.append(button);
 }
}
let lastResult,displayedResult=null;
function configureResult(value){
 const signature=JSON.stringify(value);
 if(signature===lastResult)return;
 lastResult=signature;displayedResult=value;
 const panel=document.getElementById('result'),display=document.getElementById('display');
 panel.hidden=!value;
 if(!value){display.scrollTop=0;return;}
 panel.setAttribute('aria-label',value.resultLabel);
 document.getElementById('result-status').textContent=value.status;
 document.getElementById('result-verified').hidden=!value.verified;
 const formula=document.getElementById('result-math'),plain=document.getElementById('result-plain');
 formula.dataset.latex=value.latex;formula.setAttribute('aria-label',value.text||value.latex);
 formula.hidden=!value.latex;plain.hidden=Boolean(value.latex);plain.textContent=value.text;
 if(value.latex){
  try{formula.innerHTML=MathLive.convertLatexToMarkup(value.latex);}
  catch(_){formula.hidden=true;plain.hidden=false;}
 }
 const approximation=document.getElementById('result-approximation');
 approximation.hidden=!value.approximation;approximation.textContent=value.approximation?'≈ '+value.approximation:'';
 document.getElementById('result-details').hidden=!value.hasDetails;
 for(const [id,label] of [['result-copy',value.copyLabel],['result-details',value.detailsLabel]]){
  const button=document.getElementById(id);button.title=label;button.setAttribute('aria-label',label);
 }
 // Scroll only the display on short screens, never the document or keyboard.
 requestAnimationFrame(()=>{if(displayedResult===value)display.scrollTop=display.scrollHeight;});
}
for(const [id,type] of [['result-copy','copyResult'],['result-details','resultDetails']]){
 document.getElementById(id).addEventListener('click',()=>{
  if(displayedResult)send({type,resultId:displayedResult.id});
 });
}
// Keep the web iframe's keyboard inside its own editor instead of proxying it to Flutter's document.
mf.mathVirtualKeyboardPolicy=parent===window?'manual':'sandboxed';
window.mathVirtualKeyboard.container=keyboard;window.mathVirtualKeyboard.editToolbar='none';window.mathVirtualKeyboard.targetOrigin='*';
window.mathVirtualKeyboard.addEventListener('geometrychange',()=>{const h=window.mathVirtualKeyboard.boundingRect.height;if(h>0)keyboard.style.height=h+'px';});
function key(label, latex=label){return {label,latex};}
// Keep the label compact and put the caret in the function's argument.
function functionKey(latex){return {latex,label:latex.slice(1),insert:latex+'\\left(#0\\right?'};}
// typedText uses MathLive's smart-fence behavior when closing a function.
function fenceKey(label){return {label,command:['typedText',label,{simulateKeystroke:true}]};}
// QWERTY enters mathematical letters and numbers in the current argument.
function typedKey(letter){return {label:letter,command:['typedText',letter,{simulateKeystroke:true}]};}
function letterKeys(letters){return [...letters].map(letter=>({...typedKey(letter),shift:typedKey(letter.toUpperCase())}));}
function layouts(es){return [
 {label:es?'Básico':'Basic',tooltip:'123',rows:[
 [{label:'C',command:'deleteAll'},fenceKey('('),fenceKey(')'),{label:'⌫',command:'deleteBackward'}],
 [key('7'),key('8'),key('9'),key('÷','\\div')],
 [key('4'),key('5'),key('6'),key('×','\\times')],
 [key('1'),key('2'),key('3'),key('−','-')],
 [key('0'),key('.'),key('='),key('+')]]},
 {label:es?'Científico':'Scientific',layers:[{id:'jem-scientific',rows:[
 [functionKey('\\sin'),functionKey('\\cos'),functionKey('\\tan'),
  {latex:'^{#?}',label:'xⁿ'},{label:'⌫',command:'deleteBackward'}],
 [{latex:'\\arcsin',label:'sin⁻¹',class:'small'},
  {latex:'\\arccos',label:'cos⁻¹',class:'small'},
  {latex:'\\arctan',label:'tan⁻¹',class:'small'},'\\ln','\\log'],
 [{latex:'\\sqrt{#0}',label:'√'},{latex:'\\sqrt[#?]{#0}',label:'ⁿ√'},
  {latex:'\\frac{#0}{#?}',label:'a/b'},{latex:'\\exp\\left(#0\\right)',label:'exp'},
  {latex:'\\left|#0\\right|',label:'|x|'}],
 ['x','y','z','\\pi','e'],
 [fenceKey('('),fenceKey(')'),'!','=',
  {label:'↵',class:'action',command:['performWithFeedback','commit']}]]}]},
 {label:es?'Cálculo':'Calculus',rows:[
 [{latex:'\\frac{d}{dx}\\left(#0\\right)',label:'d/dx'},
  {latex:'\\int #0 \\,\\mathrm{d}x',label:'∫'},
  {latex:'\\int_{#?}^{#?} #0 \\,\\mathrm{d}x',label:'∫ₐᵦ'},
  {latex:'\\lim_{x\\to #?} #0',label:'lim'}],
 ['x','y','z','\\infty'],
 [key('dx','\\,\\mathrm{d}x'),key('dy','\\,\\mathrm{d}y'),key('dz','\\,\\mathrm{d}z'),key('dt','\\,\\mathrm{d}t')],
 [fenceKey('('),fenceKey(')'),'=',{latex:';',label:es?'fila':'row'}],
 [{label:'↶',command:'undo'},{label:'↷',command:'redo'},
  {label:'←',command:'moveToPreviousChar'},{label:'→',command:'moveToNextChar'}]]},
 {label:'ABC',tooltip:es?'Letras · QWERTY':'Letters · QWERTY',displayShiftedKeycaps:false,layers:[{id:'jem-abc',rows:[
 [...'1234567890'].map(n=>typedKey(n)),
 letterKeys('qwertyuiop'),
 ['[separator-5]',...letterKeys('asdfghjkl'),'[separator-5]'],
 [{label:'[shift]',tooltip:es?'Mayúsculas':'Uppercase',width:1.5},...letterKeys('zxcvbnm'),{label:'⌫',command:'deleteBackward',width:1.5}],
 [fenceKey('('),fenceKey(')'),key('+'),key('−','-'),key('='),
  {...typedKey(' '),label:'␣',tooltip:es?'Espacio':'Space',width:2},
  {label:'←',command:'moveToPreviousChar'},{label:'→',command:'moveToNextChar'},
  {label:'↵',class:'action',command:['performWithFeedback','commit']}]]}]}
];}
// Reconcile against MathLive's actual state after the native view has resized.
// A requested keyboard can become hidden when its WebView loses focus.
function syncKeyboard(){
 if(keyboardWanted){
  if(!window.mathVirtualKeyboard.visible){mf.focus();window.mathVirtualKeyboard.show({animate:false});}
 }else if(window.mathVirtualKeyboard.visible){window.mathVirtualKeyboard.hide({animate:false});}
}
let syncFrame;
function scheduleKeyboardSync(){cancelAnimationFrame(syncFrame);syncFrame=requestAnimationFrame(syncKeyboard);}
new ResizeObserver(scheduleKeyboardSync).observe(document.documentElement);
mf.addEventListener('focus',scheduleKeyboardSync);
// This manual keyboard belongs to one editor, even while Flutter has focus.
// Route editing commands directly to it instead of relying on MathLive's
// delayed (60ms) reconnection of a blurred field to the virtual keyboard.
const dispatchKeyboardCommand=window.mathVirtualKeyboard.executeCommand.bind(window.mathVirtualKeyboard);
const keyboardCommands=new Set(['switchKeyboardLayer','toggleVirtualKeyboard','hideVirtualKeyboard','showVirtualKeyboard']);
window.mathVirtualKeyboard.executeCommand=command=>{
 const selector=Array.isArray(command)?command[0]:command;
 if(keyboardCommands.has(selector))return dispatchKeyboardCommand(command);
 mf.focus({preventScroll:true});return mf.executeCommand(command);
};
mf.menuItems=[];mf.smartFence=true;mf.inlineShortcuts={...mf.inlineShortcuts,sen:'\\sin',tg:'\\tan'};
window.configure=function(c){
 const st=document.documentElement.style;const dark=c.dark;
 const p=c.palette||{bg:dark?'#000000':'#fff3f1',fg:dark?'#f2f2f2':'#2d1b20',key:dark?'#242424':'#ffffff',line:dark?'#3a3a3a':'#edd7d8',accent:dark?'#ff8998':'#b9263d',onAccent:dark?'#510c1e':'#ffffff'};
 for(const name of ['bg','fg','key','line','accent']){if(/^#[0-9a-f]{6}$/i.test(p[name]||''))st.setProperty('--'+name,p[name]);}
 if(/^#[0-9a-f]{6}$/i.test(p.onAccent||''))st.setProperty('--on-accent',p.onAccent);
 st.setProperty('--key-hover',p.keyHover||(dark?'#303030':'#fff0f2'));
 st.setProperty('--key-pressed',p.keyPressed||(dark?'#484848':'#ffdce2'));
 st.setProperty('--result',/^#[0-9a-f]{6}$/i.test(p.result||'')?p.result:(dark?'#360f19':'#ffe8e9'));
 st.colorScheme=dark?'dark':'light';
 if(lastLanguage!==c.language){MathfieldElement.locale=c.language||'es';mf.setAttribute('aria-label',c.language==='es'?'Ecuación':'Equation');window.mathVirtualKeyboard.layouts=layouts(c.language==='es');lastLanguage=c.language;}
 keyboardWanted=Boolean(c.keyboard);
 keyboard.classList.toggle('hidden',!keyboardWanted);document.body.classList.toggle('compact',!keyboardWanted);
 if(!keyboardWanted)window.mathVirtualKeyboard.hide({animate:false});
 scheduleKeyboardSync();
 if(c.latex!==undefined && c.latex!==mf.value){suppress=true;mf.setValue(c.latex,{silenceNotifications:true});suppress=false;}
 configureCompletion(c.completion??null);
 configureResult(c.result??null);
 // Only a confirmed completion requests focus. Repeated model updates preserve the caret.
 if(keyboardWanted && c.focusRequest>0 && c.focusRequest!==lastFocusRequest){
  lastFocusRequest=c.focusRequest;mf.focus();mf.position=0;mf.executeCommand('moveToNextPlaceholder');
 }
};
window.setDraft=function(latex){suppress=true;mf.setValue(latex,{silenceNotifications:true});mf.position=-1;suppress=false;};
window.insertLatex=function(latex){mf.focus();mf.insert(latex);};
mf.addEventListener('input',()=>{if(!suppress)send({type:'input',latex:mf.value});});
mf.addEventListener('beforeinput',ev=>{if(ev.inputType==='insertLineBreak'||ev.data==='insertLineBreak'){ev.preventDefault();send({type:'submit'});}});
mf.addEventListener('change',()=>{});

mf.addEventListener('selection-change',()=>send({type:'selection',selection:mf.selection}));
window.addEventListener('message',event=>{
 if(event.origin!==location.origin || event.source!==parent || typeof event.data!=='string')return;
 let data;try{data=JSON.parse(event.data);}catch(_){return;}
 if(data.channel==='jem-editor' && data.type==='configure' && data.configuration)window.configure(data.configuration);
});
customElements.whenDefined('math-field').then(()=>{ready=true;send({type:'ready'});});
</script></body></html>

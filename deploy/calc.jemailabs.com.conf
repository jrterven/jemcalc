# Dedicated virtual host; the existing jemailabs.com site is unchanged.
limit_req_zone $binary_remote_addr zone=jemcalc_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=jemcalc_api:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=jemcalc_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name calc.jemailabs.com;
    return 301 https://calc.jemailabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name calc.jemailabs.com;
    ssl_certificate /etc/ssl/cloudflare/jemailabs.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jemailabs.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 9m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn jemcalc_connections 16;
    access_log /var/log/nginx/calc.jemailabs.com.access.log;
    error_log /var/log/nginx/calc.jemailabs.com.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy 'camera=(self), microphone=(self), geolocation=()' always;

    proxy_set_header Host calc.jemailabs.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    proxy_buffering off;

    location = /access {
        limit_req zone=jemcalc_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:5188;
    }
    location = /api/v1/dictation {
        limit_req zone=jemcalc_api burst=6 nodelay;
        proxy_set_header Host calc.jemailabs.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:5188;
    }
    location /api/ {
        limit_req zone=jemcalc_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:5188;
    }
    location / {
        proxy_pass http://127.0.0.1:5188;
    }
}

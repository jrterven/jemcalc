name: jemcalc
services:
  app:
    image: jemcalc:${JEMCALC_RELEASE:?Set JEMCALC_RELEASE}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:5188:8080"
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - /home/juan/jemcalc/shared/downloads:/srv/web/downloads:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/api/health',headers={'Host':'calc.jemailabs.com'}),timeout=5); assert r.status==200"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
